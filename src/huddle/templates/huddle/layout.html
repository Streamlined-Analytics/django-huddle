{% extends base_template %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'huddle/huddle.css' %}">
<script src="{% static 'huddle/huddle.js' %}" defer></script>
<div class="huddle" hx-ext="ws" ws-connect="{{ websocket_url }}" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <aside class="huddle-sidebar">{% include "huddle/components/sidebar.html" %}</aside>
  <main class="huddle-main">{% block huddle_main %}{% endblock %}</main>
  <aside id="huddle-thread" class="huddle-thread" aria-live="polite"></aside>
</div>
{% endblock %}
