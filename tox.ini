[tox]
requires =
    tox>=4.2
env_list =
    py{312,313,314}-django{60,61}

[testenv]
package = wheel
wheel_build_env = .pkg
dependency_groups = test
deps =
    django60: django>=6,<6.1
    django61: django>=6.1,<6.2
set_env =
    PYTHONDEVMODE = 1
commands =
    python \
      -W error::DeprecationWarning \
      -W error::PendingDeprecationWarning \
      -m coverage run \
      -m pytest {posargs:tests}
